name: Auto Deploy to CloudPanel VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Auto-Deployment
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "🚀 Calling deployment webhook..."
            curl -s -f -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" || echo "Webhook called"
          else
            echo "⚠️ DEPLOY_WEBHOOK_URL secret not set. Skipping automatic webhook call."
          fi
